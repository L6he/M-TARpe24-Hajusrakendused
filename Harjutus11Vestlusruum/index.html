<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vestlusruum</title>
</head>
<body>
    <form name="publish">
        <input type="text" name="message" maxlength="50">
        <input type="submit" value="Saada">
    </form>
    <div id="messages"></div>
    <script>
        let protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        let url = `${protocol}//${location.host}/ws`;

        let socket = new WebSocket(url);
        let myName = prompt('Sisesta oma nimi vestluses:', 'Külaline') || 'Anonüümne';
        let myMessage = "";
        //Vormilt sõnumi saatmine
        document.forms.publish.onsubmit = function() {
            myMessage = { name: myName, time: new Date().toUTCString(), message: myMessage};
            socket.send(JSON.stringify(myMessage));
            this.message.value = "";
            return false;
        }

        //Saabunud sõnumite töötlemine
        socket.onmessage = function(event) {
            let messageElement = document.createElement("div");
            receivedMessage = JSON.parse(event.data);
            if (receivedMessage.name === myMessage.name && receivedMessage.time === myMessage.time) {
                messageElement.style.backgroundColor = "lightgray";
                messageElement.style.textAlign = "right";
            }
            messageElement.textContent = `${receivedMessage.name}@${receivedMessage.time}: ${receivedMessage.message}`;
            document.getElementById("messages").append(messageElement);
        }

        //Kui ühendus katkeb, logime
        socket.onclose = event => console.log("Closed", event.code);
    </script>
</body>
</html>
