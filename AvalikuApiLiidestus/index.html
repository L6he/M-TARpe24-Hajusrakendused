<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Avaliku API Liidestus</title>
    </head>

    <body>
        <button type="button" id="reqBtn" onclick="loadDoc()">Request Pokémon</button>
        <p id="demo"></p>
        
        <footer style="position: fixed; left: 0; bottom: 0; background-color: black; color: white; text-align: center; width: 100%;">
            <a href="https://markomaripuu23.thkit.ee/" target="_blank" style="font-size: 150%; color: white; text-decoration: underline; background-color: black;">Index</a>
        </footer>
        <script defer>
            const defaultUrl = "https://pokeapi.co/api/v2/pokemon/"; // Allikas: https://pokeapi.co/docs/v2#pokemon
            var nextPageUrl = defaultUrl; 

            function loadDoc() {
                const xhttp = new XMLHttpRequest();
                xhttp.onload = function() {
                    const data = this.responseText;
                    const response = JSON.parse(data); 
                    // console.log(response);
                    const pokemonid = response.results.map(item=>`<li>${item.name.charAt(0).toUpperCase() + item.name.slice(1)}</li>`); // Allikas: https://stackoverflow.com/questions/1026069/how-do-i-make-the-first-letter-of-a-string-uppercase-in-javascript
                    nextPageUrl = response.next; 
                    if (nextPageUrl === null) {
                        nextPageUrl = defaultUrl;
                    }
                    let dataHtml = "<ul>"
                    for (const pokemon of pokemonid) {
                        dataHtml += pokemon;
                    }
                    dataHtml += "</ul>";
                    document.getElementById("demo").innerHTML = dataHtml;  
                    document.getElementById("reqBtn").innerHTML = "Request More Pokémon";  
                };
                xhttp.open("GET", nextPageUrl);
                xhttp.send();
            }
        </script>
    </body>
</html>
